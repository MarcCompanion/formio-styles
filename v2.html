<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanalisationsbegehren V2 (Test)</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@formio/js@5/dist/formio.full.min.css">
  <link rel="stylesheet" href="basel-formular.css">
  <style>
    body { background: #fff; margin: 0; }
    .seite { max-width: 1060px; margin: 0 auto; padding: 16px 20px 48px; }
    .testhinweis { background: #16241b; color: #e9f2ec; font: 13px/1.4 "Inter", system-ui, sans-serif; padding: 8px 20px; }
    .testhinweis strong { background: #a5e0f0; color: #0d3340; padding: 1px 8px; margin-right: 8px; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; }
    .danke { border-left: 4px solid #2c8450; background: #f4f7f4; padding: 22px 24px; max-width: 860px; font-family: "Inter", system-ui, sans-serif; }
    .danke h2 { font-size: 24px; margin: 0 0 10px; }
    .danke .bs-h1 { color: #2c8450; font-size: clamp(26px, 5vw, 40px); line-height: 1.1; font-weight: 700; margin: 0 0 18px; }
    .danke .kontakt { margin-top: 22px; padding-top: 14px; border-top: 1px solid #c5ccc7; font-size: 15px; }
    .danke .kontakt p { margin: 0 0 4px; }
    .danke .test { margin-top: 18px; font-size: 13px; color: #5a645e; }
    .fehler { border-left: 4px solid #b3261e; background: #fbe4e1; color: #7a1710; padding: 12px 16px; max-width: 760px; }
  </style>
</head>
<body>
  <div class="testhinweis"><strong>Prototyp</strong>Testversion zur Projektarbeit. Bitte keine echten Personendaten oder Pläne hochladen.</div>
  <main class="seite">
    <div id="formular">Formular wird geladen …</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@formio/js@5/dist/formio.full.min.js"></script>
  <script>
    // Adresse des Formulars im Form.io-Projekt
    var FORM_URL = 'https://sxpymcwzalmfzyx.form.io/p028kanalisationsbegehren-v2';

    var DE = {
      next: 'Weiter', previous: 'Zurück', cancel: 'Abbrechen', submit: 'Einreichen',
      complete: 'Vielen Dank', error: 'Bitte korrigieren Sie die markierten Angaben.',
      required: '{{field}} ist ein Pflichtfeld.',
      invalid_email: '{{field}} muss eine gültige E-Mail-Adresse sein.',
      maxLength: '{{field}} darf höchstens {{length}} Zeichen lang sein.',
      pattern: '{{field}} entspricht nicht dem erwarteten Format.',
      'Drop files to attach,': 'Dateien hierher ziehen,',
      'or': 'oder', 'browse': 'durchsuchen',
      'Are you sure you want to cancel?': 'Möchten Sie das Ausfüllen wirklich abbrechen? Ihre Angaben gehen verloren.',
      'Type to search': 'Zum Suchen tippen', 'No results found': 'Keine Treffer',
      'No choices to choose from': 'Keine Auswahl verfügbar'
    };

    Formio.createForm(document.getElementById('formular'), FORM_URL, {
      language: 'de',
      i18n: { de: DE },
      breadcrumbSettings: { clickable: true },
      buttonSettings: { showCancel: true }
    }).then(function (form) {
      form.nosubmit = false;
      form.on('submitDone', function (submission) {
        var art = submission && submission.data ? submission.data.howToSubmit : '';
        var nr = submission && submission.data ? submission.data.applicationNumber : '';
        var nummer = nr ? '<p>Ihre Antragsnummer: <strong>' + String(nr).replace(/[<>&]/g, '') + '</strong> (provisorisch). ' +
          'Bitte geben Sie diese Nummer bei Rückfragen an.</p>' : '';
        var kontakt =
          '<div class="kontakt"><p>Freundliche Grüsse</p>' +
          '<p><strong>Tiefbauamt Basel-Stadt, Abteilung Entwässerung</strong></p>' +
          '<p>Telefon <a href="tel:+41612679308">+41 61 267 93 08</a> · ' +
          '<a href="mailto:entwaesserung@bs.ch">entwaesserung@bs.ch</a></p>' +
          '<p>Telefonische Beratung Montag bis Freitag von 10 bis 12 Uhr. Terminvereinbarung möglich.</p></div>';
        var text = art === 'papier'
          ? '<h2>Bitte senden Sie uns die Unterlagen per Post.</h2>' +
            '<p>Vielen Dank für Ihr Kanalisationsbegehren. Ihre Angaben sind bei uns eingegangen. ' +
            'Bitte denken Sie daran, uns die Unterlagen per Post zuzustellen.</p>'
          : '<h2>Ihr Antrag wurde erfolgreich eingereicht.</h2>' +
            '<p>Vielen Dank für Ihr Kanalisationsbegehren. Sie erhalten zusätzlich eine kurze Bestätigung per E-Mail.</p>';
        document.getElementById('formular').innerHTML =
          '<div class="danke" data-art="' + (art === 'papier' ? 'papier' : 'online') + '">' +
          '<p class="bs-h1">Danke für Ihr Kanalisationsbegehren</p>' + text + nummer + kontakt +
          '<p class="test">Testversion: Es wird keine E-Mail versendet und keine Post erwartet.</p></div>';
        window.scrollTo(0, 0);
      });
    }).catch(function (err) {
      document.getElementById('formular').innerHTML =
        '<div class="fehler">Das Formular konnte nicht geladen werden: ' + (err && err.message ? err.message : err) + '</div>';
    });
  </script>
</body>
</html>
